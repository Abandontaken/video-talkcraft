name: Sync upstream

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync from upstream
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh repo sync "${{ github.repository }}" --branch "${{ github.event.repository.default_branch }}"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "sync_exit=$status" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update conflict issue
        if: steps.sync.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE='Upstream sync needs manual merge'
          BODY="Automatic daily sync from upstream failed because this fork has diverged or has merge conflicts.

          This workflow never force-pushes. Please merge upstream into the default branch manually (GitHub's \"Sync fork\" UI, or a local merge), then resolve conflicts.

          Failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Close this issue after you have merged."
          existing="$(gh issue list --repo "${{ github.repository }}" --state open --json number,title --jq '.[] | select(.title=="Upstream sync needs manual merge") | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "Another automatic sync attempt failed. Manual merge is still required.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi

      - name: Disable other Actions workflows
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SELF_PATH='.github/workflows/sync-upstream.yml'
          gh api "repos/${{ github.repository }}/actions/workflows" --paginate \
            --jq '.workflows[] | [.id, .path, .state] | @tsv' \
          | while IFS=$'\t' read -r id path state; do
              [ -n "${id:-}" ] || continue
              if [ "$path" = "$SELF_PATH" ]; then
                if [ "$state" != "active" ]; then
                  echo "Enabling $path ($id)"
                  gh api --method PUT "repos/${{ github.repository }}/actions/workflows/${id}/enable"
                fi
                continue
              fi
              if [ "$state" = "active" ]; then
                echo "Disabling $path ($id, state=$state)"
                gh api --method PUT "repos/${{ github.repository }}/actions/workflows/${id}/disable"
              fi
            done
